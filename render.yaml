# Render blueprint: the API (Docker) and its Postgres database.
# The web app goes on Vercel and proxies /api/* here (see README, "Deploying").
services:
  - type: web
    name: phishguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: phishguard-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "1"
      # Public HTTPS URL of the trained model file and its SHA-256.
      - key: MODEL_URL
        sync: false
      - key: MODEL_SHA256
        sync: false
      # Web app address, used in password-reset links.
      - key: APP_URL
        sync: false
      # Optional: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_FROM for real email.

databases:
  - name: phishguard-db
    plan: free
